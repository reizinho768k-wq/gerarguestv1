<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEX822 W • Gerador Free Fire</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 95%;
  max-width: 420px;
  background: rgba(15, 23, 42, 0.95);
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 0 40px rgba(34, 197, 94, 0.2);
}

h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #22c55e;
}

.input-group {
  margin-bottom: 15px;
}

input, select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: #020617;
  color: white;
  border: 1px solid #1e293b;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: black;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px #22c55e;
}

#resultado {
  margin-top: 20px;
  background: #020617;
  padding: 15px;
  border-radius: 12px;
  font-size: 12px;
  max-height: 250px;
  overflow-y: auto;
  border: 1px solid #1e293b;
  white-space: pre-wrap;
}

.loader {
  border: 3px solid #1e293b;
  border-top: 3px solid #22c55e;
  border-radius: 50%;
  width: 25px;
  height: 25px;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

.footer {
  text-align: center;
  font-size: 12px;
  margin-top: 10px;
  color: #64748b;
}
</style>
</head>

<body>

<div class="container">

  <h1>🔥 VORTEX822 W</h1>

  <div class="input-group">
    <input type="text" id="name" placeholder="Nome (ex: VORTEX)">
  </div>

  <div class="input-group">
    <input type="number" id="count" placeholder="Quantidade (max 15)" max="15">
  </div>

  <div class="input-group">
    <select id="region">
      <option value="Brasil">Brasil</option>
      <option value="Índia">Índia</option>
      <option value="América do Norte">América do Norte</option>
      <option value="Europa">Europa</option>
      <option value="Rússia">Rússia</option>
      <option value="Tailândia">Tailândia</option>
      <option value="Indonésia">Indonésia</option>
    </select>
  </div>

  <button onclick="gerar()">GERAR CONTAS</button>

  <div id="resultado">Aguardando...</div>

  <div class="footer">
    Criado por VORTEX822 W 🚀
  </div>

</div>

<script>
async function gerar() {
  const name = document.getElementById("name").value || "TESTE";
  const count = document.getElementById("count").value || 1;
  const region = document.getElementById("region").value;

  const message = `Gere ${count} contas fictícias de Free Fire para o nome ${name} na região ${region}. Liste os UIDs gerados.`;
  const apiKey = "LEOMODZ";

  const api = `https://apiguest.onrender.com/ask?message=${encodeURIComponent(message)}&key=${apiKey}`;

  const resultBox = document.getElementById("resultado");
  resultBox.innerHTML = '<div class="loader"></div>';

  try {
    const res = await fetch(api);
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Erro na resposta da API");
    }

    if (data.reply) {
      resultBox.innerText = data.reply;
    } else {
      resultBox.innerText = "❌ Nenhuma resposta recebida.";
    }

  } catch (err) {
    resultBox.innerText =
      "❌ Erro ao comunicar com a API\n\n" +
      "Motivos possíveis:\n" +
      "- A API ainda está a atualizar no Render (aguarde 1 a 2 minutos)\n" +
      "- Servidor offline\n\n" +
      "Detalhes: " + err.message;
  }
}
</script>

</body>
</html>
