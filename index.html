<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEO MODZ • Gerador Free Fire</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 95%;
  max-width: 420px;
  background: rgba(15, 23, 42, 0.95);
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 0 40px rgba(34, 197, 94, 0.2);
}

h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #22c55e;
}

.input-group {
  margin-bottom: 15px;
}

input, select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  background: #020617;
  color: white;
  border: 1px solid #1e293b;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: black;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px #22c55e;
}

#resultado {
  margin-top: 20px;
  background: #020617;
  padding: 15px;
  border-radius: 12px;
  font-size: 12px;
  max-height: 250px;
  overflow-y: auto;
  border: 1px solid #1e293b;
}

.loader {
  border: 3px solid #1e293b;
  border-top: 3px solid #22c55e;
  border-radius: 50%;
  width: 25px;
  height: 25px;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

.footer {
  text-align: center;
  font-size: 12px;
  margin-top: 10px;
  color: #64748b;
}
</style>
</head>

<body>

<div class="container">

  <h1>🔥 LEO MODZ</h1>

  <div class="input-group">
    <input type="text" id="name" placeholder="Nome (ex: LEO)">
  </div>

  <div class="input-group">
    <input type="number" id="count" placeholder="Quantidade (max 15)" max="15">
  </div>

  <div class="input-group">
    <select id="region">
      <option value="BR">Brasil</option>
      <option value="IND">Índia</option>
      <option value="NA">América do Norte</option>
      <option value="EU">Europa</option>
      <option value="RU">Rússia</option>
      <option value="TH">Tailândia</option>
      <option value="ID">Indonésia</option>
    </select>
  </div>

  <button onclick="gerar()">GERAR CONTAS</button>

  <div id="resultado">Aguardando...</div>

  <div class="footer">
    Criado por LEO MODZ 🚀
  </div>

</div>

<script>
async function gerar() {
  const name = document.getElementById("name").value || "TESTE";
  const count = document.getElementById("count").value || 1;
  const region = document.getElementById("region").value;

  const api = `https://leomdzguestapi.vercel.app/gen?name=${name}&count=${count}&region=${region}`;
  
  // 🔥 PROXY CORS
  const url = "https://api.allorigins.win/raw?url=" + encodeURIComponent(api);

  const resultBox = document.getElementById("resultado");
  resultBox.innerHTML = '<div class="loader"></div>';

  try {
    const res = await fetch(url);

    if (!res.ok) throw new Error("Erro na API");

    const text = await res.text();
    const data = JSON.parse(text);

    if (!data.accounts || data.accounts.length === 0) {
      resultBox.innerText = "❌ Nenhuma conta gerada";
      return;
    }

    let texto = "";

    data.accounts.forEach((acc, i) => {
      texto += `🔥 Conta ${i+1}\nUID: ${acc.uid}\n\n`;
    });

    resultBox.innerText = texto;

  } catch (err) {
    resultBox.innerText =
      "❌ Erro ao gerar contas\n\n" +
      "Possíveis causas:\n" +
      "- API offline\n" +
      "- Proxy lento\n" +
      "- Internet ruim\n\n" +
      "Erro: " + err.message;
  }
}
</script>

</body>
</html>
